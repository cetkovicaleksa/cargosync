server:
  port: 8080
spring:
  application:
    name: CargoSyncCore
  autoconfigure:
    exclude: org.springframework.boot.amqp.autoconfigure.RabbitAutoConfiguration
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
#        jdbc:
#          batch_size: 100
#        order_updates: true
#        order_inserts: true
  datasource:
    url: ${CARGOSYNC_DB_URL}
    username: ${CARGOSYNC_DB_USERNAME}
    password: ${CARGOSYNC_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari: # maybe separate for prod/dev
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000 # ms [30 s]
      max-lifetime: 1800000 # ms [30 min]
      connection-timeout: 20000 # ms [20 s]
      transaction-isolation: TRANSACTION_READ_COMMITTED # read commited is default
  content:
    store:
      type: fs
      location: ${CARGOSYNC_CONTENT_ROOT}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  mail:
    host: ${CARGOSYNC_MAIL_HOST:smtp.gmail.com}
    port: ${CARGOSYNC_MAIL_PORT:587}
    username: ${CARGOSYNC_MAIL_USERNAME:}
    password: ${CARGOSYNC_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  frontend-url: ${CARGOSYNC_FRONTEND_URL:http://localhost:4200}
  activation-token-ttl: 24h

security:
  public-endpoints:
    - /login
    - /auth/login
    - /auth/logout
    - /auth/change-password
    - /auth/register
    - /auth/activate
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs/**
  cors:
    allowed-headers: ["Authorization", "Content-Type", "Accept", "Content-Length", "User-Agent", "Accept-Encoding"]
    allowed-methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  auth:
    jwt:
      issuer: https://team15.nvt.ftn.uns.ac.rs
      algorithm: HS256
      access-token:
        secret: ${CARGOSYNC_AT_SECRET}
        ttl: 1h
