spring:
  web:
    error:
      include-message: always
  jpa:
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: update # alias for spring.jpa.hibernate.ddl-auto
          create_output: ddl.sql
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
security:
  cors:
    allowed-origins:
      - http://localhost:4200/
