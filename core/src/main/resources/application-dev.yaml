server:
  servlet:
    context-path: /api
spring:
  web:
    error:
      include-message: always
  jpa:
    show-sql: true
    generate-ddl: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          auto: update # alias for spring.jpa.hibernate.ddl-auto
          create_output: ddl.sql
  mail:
    host: ${CARGOSYNC_MAIL_HOST:localhost}
    port: ${CARGOSYNC_MAIL_PORT:1025}
    username: ${CARGOSYNC_MAIL_USERNAME:}
    password: ${CARGOSYNC_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
security:
  cors:
    allowed-headers: ["*"]
    allowed-origins:
      - "*"
  auth:
    jwt:
      access-token:
        ttl: 24h
