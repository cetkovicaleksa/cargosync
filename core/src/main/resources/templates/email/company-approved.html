<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Company Approved</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            color: #333333;
        }
        .wrapper {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: green;
            padding: 32px 40px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header p {
            margin: 6px 0 0;
            color: #D1C4E9;
            font-size: 13px;
        }
        .body {
            padding: 40px;
        }
        .body h2 {
            margin: 0 0 16px;
            font-size: 22px;
            color: #212121;
        }
        .body p {
            margin: 0 0 20px;
            font-size: 15px;
            line-height: 1.6;
            color: #555555;
        }
        .footer {
            background-color: #f5f5f5;
            padding: 20px 40px;
            text-align: center;
            font-size: 12px;
            color: #aaaaaa;
            border-top: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <h1>CargoSync</h1>
        <p>Logistics &amp; Supply Chain Management</p>
    </div>
    <div class="body">
        <h2>Hello, <span th:text="${firstName}">User</span>!</h2>
        <p>
            Your request for <q th:text="${companyName}">a</q> company has been approved by one of our managers.
            You can start purchasing products for Your company.
        </p>
    </div>
    <div class="footer">
        &copy; 2026 CargoSync &mdash; All rights reserved.
    </div>
</div>
</body>
</html>
