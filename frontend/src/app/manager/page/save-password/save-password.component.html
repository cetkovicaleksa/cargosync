<h2 mat-dialog-title>Save manager's password</h2>

<div mat-dialog-content class="dialog-content">
	<p class="note">
		This manager password is shown only once. Save it now and share it securely with the manager. They will have to change it on their first login.
	</p>

	<div class="password-box" aria-label="Temporary manager password">
		{{ data.password }}
	</div>
</div>

<div mat-dialog-actions align="end" class="actions">
	<button mat-stroked-button color="primary" type="button" (click)="copyPassword()">
		<mat-icon>content_copy</mat-icon>
		Copy password
	</button>
	<button mat-flat-button color="primary" type="button" (click)="close()">Close</button>
</div>
