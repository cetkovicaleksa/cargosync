<h2 mat-dialog-title>{{ title }}</h2>

<div mat-dialog-content class="content">
  <form [formGroup]="form" class="form">
    <div class="grid-2">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <div class="file-upload">
        <mat-form-field appearance="outline" class="file-field">
          <mat-label>Image file</mat-label>
          <input matInput [value]="selectedImageName || 'No file selected'" readonly />
          <button mat-button matSuffix type="button" (click)="productImageInput.click()">Browse</button>
        </mat-form-field>
        <input
          #productImageInput
          class="hidden-file-input"
          type="file"
          accept="image/*"
          (change)="onImageSelected($event)"
        />
        <div class="file-name" *ngIf="!selectedImageName && existingImageUrl">Current image kept</div>
      </div>
    </div>

    <div class="grid-2">
      <mat-form-field appearance="outline">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Weight (kg)</mat-label>
        <input matInput type="number" formControlName="weight" />
      </mat-form-field>
    </div>

    <div class="grid-2">
      <mat-form-field appearance="outline">
        <mat-label>Category name</mat-label>
        <input matInput formControlName="categoryName" [matAutocomplete]="categoryAuto" />
        <mat-hint>Select existing or type a new category</mat-hint>
      </mat-form-field>

      <mat-autocomplete #categoryAuto="matAutocomplete">
        <mat-option *ngFor="let category of filteredCategoryOptions | async" [value]="category">
          {{ category }}
        </mat-option>
      </mat-autocomplete>

      <mat-form-field appearance="outline">
        <mat-label>Factory IDs (comma-separated UUIDs)</mat-label>
        <input matInput formControlName="factoryIdsCsv" placeholder="uuid1, uuid2, ..." />
      </mat-form-field>
    </div>

    <mat-slide-toggle formControlName="isForSale" color="primary">For sale</mat-slide-toggle>
  </form>
</div>

<div mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading">Cancel</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="loading || form.invalid">
    {{ loading ? 'Saving…' : 'Save' }}
  </button>
</div>
