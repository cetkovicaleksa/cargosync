<div class="page">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title>Change your password</mat-card-title>
      <mat-card-subtitle>
        For security reasons, you must change the initial password before using the application.
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="form">
        <mat-form-field appearance="outline">
          <mat-label>Current password</mat-label>
          <input matInput type="password" formControlName="oldPassword" autocomplete="current-password" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>New password</mat-label>
          <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
          <mat-hint>Minimum 8 characters.</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Confirm new password</mat-label>
          <input matInput type="password" formControlName="confirmNewPassword" autocomplete="new-password" />
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" [disabled]="loading || form.invalid">
          {{ loading ? 'Saving…' : 'Update password' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
