<mat-card class="card">
  <mat-card-header>
    <mat-card-title>Managers</mat-card-title>
    <mat-card-subtitle>Search and manage manager accounts.</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content class="content">
    <div class="toolbar">
      <mat-form-field appearance="outline" class="search">
        <mat-label>Search managers</mat-label>
        <input matInput [formControl]="form.controls.query" placeholder="Username or email…" />
      </mat-form-field>

      <a mat-flat-button color="primary" routerLink="/managers/new">New manager</a>
    </div>

    <cdk-virtual-scroll-viewport
      class="viewport"
      itemSize="72"
      (scrolledIndexChange)="onViewportIndexChange($event)"
    >
      <div class="row" *cdkVirtualFor="let m of items; trackBy: trackByUsername">
        <div class="left">
          <div class="avatar" [attr.aria-label]="m.username">
            <img *ngIf="m.owner?.avatar; else initials" [src]="m.owner.avatar" alt="" />
            <ng-template #initials>
              <span>{{ (m.username || '?').slice(0, 1).toUpperCase() }}</span>
            </ng-template>
          </div>

          <div class="meta">
            <div class="title">
              <span class="name">{{ m.username }}</span>
              <span class="chip" *ngIf="m.requiresPasswordChange">Password change required</span>
            </div>
            <div class="sub">
              <span class="muted">{{ m.owner?.email || '—' }}</span>
            </div>
          </div>
        </div>

        <div class="actions">
          <button mat-stroked-button color="warn" (click)="toggleBlock(m)" [disabled]="m._locallyBlocked">
            Toggle block
          </button>
        </div>
      </div>
    </cdk-virtual-scroll-viewport>

    <div class="footer" *ngIf="!loading && !last">
      <button mat-button (click)="loadMore()" [disabled]="loadingMore">
        {{ loadingMore ? 'Loading…' : 'Load more' }}
      </button>
    </div>

    <div class="empty" *ngIf="!loading && items.length === 0">
      No managers found.
    </div>
  </mat-card-content>
</mat-card>
