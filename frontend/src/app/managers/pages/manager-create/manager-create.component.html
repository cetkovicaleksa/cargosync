<mat-card class="card">
  <mat-card-header>
    <mat-card-title>New manager</mat-card-title>
    <mat-card-subtitle>
      Create a manager account. The initial password can be viewed on the server. Manager will have change their password on the first login.
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" autocomplete="off" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Avatar URL</mat-label>
        <input matInput formControlName="avatarUrl" placeholder="https://…" autocomplete="off" />
      </mat-form-field>

      <div class="actions">
        <a mat-button routerLink="/managers">Cancel</a>
        <button mat-flat-button color="primary" type="submit" [disabled]="loading || form.invalid">
          {{ loading ? 'Creating…' : 'Create manager' }}
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
