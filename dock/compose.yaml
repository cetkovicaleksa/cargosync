name: cargosync

services:
  rabbitmq:
    image: rabbitmq:4-alpine
    expose: ["5672"]
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq:rw
    networks:
      - cargo-net

  postgres:
    image: postgres:18-alpine
    expose: ["5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data:rw
    networks:
      - cargo-net

  influxdb2:
    image: influxdb:2.8
    expose: ["8086"]
    volumes:
      - influxdb-data:/var/lib/influxdb2:rw
    networks: 
      - cargo-net

volumes:
  rabbitmq-data:
  postgres-data:
  influxdb-data:

networks:
  cargo-net:
